name: Check script

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # test_models.py depende de um Chrome local (porta 9222) e de Tkinter, então
      # não pode ser executado de fato num runner headless. Aqui só validamos que o
      # arquivo importa/compila sem erro de sintaxe ou de dependência ausente.
      - name: Compile check
        run: python -m py_compile test_models.py
